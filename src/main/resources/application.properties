spring.application.name=transfer-rag

spring.datasource.url=jdbc:mysql://localhost:3306/transfer_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# 文件上传目录
app.upload-dir=D:/transfer-rag-data/uploads/documents

# PDF OCR fallback（仅在 PDFBox 和 Tika 都无法提取文本时使用）
app.ocr.tesseract-command=${TESSERACT_COMMAND:tesseract}
app.ocr.tessdata-dir=${TESSDATA_PREFIX:}
app.ocr.language=chi_sim+eng
app.ocr.dpi=300

# =========================
# Multipart 上传大小限制
# =========================

# 单个文件最大 20MB
spring.servlet.multipart.max-file-size=20MB

# 单次 HTTP 请求最大 100MB
# 因为 batch 导入可能一次上传多个文件
spring.servlet.multipart.max-request-size=100MB

# =========================
# Spring AI
# =========================

spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

# Ollama Embedding
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=bge-m3

# DeepSeek / OpenAI Compatible API
spring.ai.openai.base-url=${AI_BASE_URL}
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.model=${AI_CHAT_MODEL}

# =========================
# Qdrant
# =========================

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=transfer_chunks
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.initialize-schema=true
