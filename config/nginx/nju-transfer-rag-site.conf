server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/nju-transfer-rag;
    index index.html;
    client_max_body_size 1m;

    location = /api/rag/ask {
        client_max_body_size 16k;
        limit_req zone=nju_rag_ask_per_ip burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Public source reads are GET/HEAD only. The application enforces the
    # per-document EVIDENCE role, approved manifest, hash and path boundary.
    location ^~ /api/public/sources/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Full metadata, extracted text and uploaded files are not public.
    location = /api/documents {
        return 404;
    }

    location ^~ /api/documents/ {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location = /admin {
        return 301 /admin/;
    }

    # SSH tunnel connections arrive at Nginx from localhost. Both the IP rule
    # and the existing Basic Auth challenge are required.
    location ^~ /admin/api/ {
        satisfy all;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        auth_basic "NJU TransferRAG Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-nju-transfer-rag;
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /admin/ {
        satisfy all;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        auth_basic "NJU TransferRAG Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-nju-transfer-rag;
        root /var/www;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
