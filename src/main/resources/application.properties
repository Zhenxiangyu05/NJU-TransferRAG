spring.application.name=transfer-rag

spring.datasource.url=jdbc:mysql://localhost:3306/transfer_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Explicitly enable only after the additive import_task migration is approved/applied.
app.import-tasks.enabled=false
app.import-tasks.lease-seconds=90
app.import-tasks.max-attempts=3
app.import-tasks.queue-capacity=8
app.import-tasks.max-runtime-seconds=1800
spring.jpa.show-sql=true

server.port=8080
server.address=127.0.0.1

# 文件上传目录
app.upload-dir=/var/lib/nju-transfer-rag/uploads/documents

# V2 canonical-first retrieval remains disabled until its retrieval path is released.
app.rag.canonical-first-enabled=false

# Disabled by default. The standalone payload-only backfill runner enables this explicitly.
app.qdrant-backfill.enabled=false
app.qdrant-backfill.dry-run=true

# PDF OCR fallback（仅在 PDFBox 和 Tika 都无法提取文本时使用）
app.ocr.tesseract-command=${TESSERACT_COMMAND:tesseract}
app.ocr.tessdata-dir=${TESSDATA_PREFIX:}
app.ocr.language=chi_sim+eng
app.ocr.dpi=300

# =========================
# Multipart 上传大小限制
# =========================

# 单个文件最大 20MB
spring.servlet.multipart.max-file-size=20MB

# 单次 HTTP 请求最大 100MB
# 因为 batch 导入可能一次上传多个文件
spring.servlet.multipart.max-request-size=100MB

# =========================
# Spring AI
# =========================

spring.ai.model.chat=openai
spring.ai.model.embedding=openai

# Ollama Embedding

# DeepSeek / OpenAI Compatible API
spring.ai.openai.base-url=${AI_BASE_URL}
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.model=${AI_CHAT_MODEL}
spring.ai.openai.embedding.model=${AI_EMBEDDING_MODEL}

# Shared legacy settings remain SCHOOL settings. Never put a DeepSeek key/URL here.
# Model-specific connections pin both import and protected query embeddings independently.
spring.ai.openai.embedding.base-url=${AI_EMBEDDING_BASE_URL:${spring.ai.openai.base-url}}
spring.ai.openai.embedding.api-key=${AI_EMBEDDING_API_KEY:${spring.ai.openai.api-key}}
spring.ai.openai.chat.base-url=${AI_CHAT_BASE_URL:${spring.ai.openai.base-url}}
spring.ai.openai.chat.api-key=${AI_CHAT_API_KEY:${spring.ai.openai.api-key}}
spring.ai.openai.chat.timeout=40s
spring.ai.openai.chat.max-retries=0
# Default retains NJUSEHub. Official credentials are read only by ChatProviderConfiguration.
app.ai.chat.provider=${AI_CHAT_PROVIDER:njusehub}
app.ai.chat.deepseek.base-url=https://api.deepseek.com
app.ai.chat.deepseek.model=${DEEPSEEK_CHAT_MODEL:deepseek-flash}

# =========================
# Qdrant
# =========================

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=transfer_chunks
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.initialize-schema=true

# Disposable query embeddings only. No Redis connection beans when disabled.
app.cache.embedding.enabled=false
app.cache.embedding.ttl=24h
app.cache.embedding.ttl-jitter=0.1
app.cache.embedding.dimensions=1024
app.cache.embedding.version=v1
app.cache.embedding.model-revision=provider-default-v1
app.cache.embedding.input-version=exact-utf8-v1
app.cache.embedding.error-backoff=5s
app.cache.embedding.redis.host=127.0.0.1
app.cache.embedding.redis.port=16379
app.cache.embedding.redis.password=${NJU_REDIS_PASSWORD:}
app.cache.embedding.redis.timeout=200ms

# Both protections are independently opt-in. No production rollout is implied.
app.rag.rate-limit.enabled=false
app.rag.rate-limit.hmac-secret=${RAG_RATE_LIMIT_HMAC_SECRET:}
# Explicitly configure trusted direct proxy addresses only after checking forwarded-header handling.
app.ai.resilience.enabled=false
